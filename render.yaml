version: "1"

databases:
  - name: siyaphambili-db
    databaseName: siyaphambili
    user: admin_user
    plan: free

services:
  # 1. Private Auth Service (Hidden from public internet)
  - type: pserv
    name: auth-service
    env: docker
    rootDir: services/auth
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siyaphambili-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. Private Core Service (Hidden from public internet)
  - type: pserv
    name: core-service
    env: docker
    rootDir: services/core
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siyaphambili-db
          property: connectionString

  # 3. Public API Gateway (Nginx)
  - type: web
    name: siyaphambili-gateway
    env: docker
    rootDir: gateway
    dockerfilePath: Dockerfile
    plan: free

  # 4. Public Frontend (React/Vite Static Site)
  - type: web
    name: siyaphambili-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: ${siyaphambili-gateway.url}
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
