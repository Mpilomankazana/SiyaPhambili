services:
  # ---------------------------------------
  # Infrastructure & Database Layer
  # ---------------------------------------
  siyaphambili_db:
    image: postgres:alpine
    container_name: siyaphambili_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Exposed for local DBeaver access
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - siyaphambili_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80" # Exposed for team web UI access
    depends_on:
      - siyaphambili_db
    networks:
      - siyaphambili_net

  # ---------------------------------------
  # Backend Microservices Layer
  # ---------------------------------------
  auth-service:
    build:
      context: ./services/auth
    container_name: auth_service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./services/auth:/app # Hot-reloading
    depends_on:
      - siyaphambili_db
    networks:
      - siyaphambili_net

  core-service:
    build:
      context: ./services/core
    container_name: core_service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8002:8002"
    volumes:
      - ./services/core:/app # Hot-reloading
    depends_on:
      - siyaphambili_db
    networks:
      - siyaphambili_net

  # ---------------------------------------
  # API Gateway & Frontend Layer
  # ---------------------------------------
  gateway:
    build:
      context: ./gateway
    container_name: api_gateway
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - core-service
    networks:
      - siyaphambili_net

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:5173" # Assuming Vite default port
    volumes:
      - ./frontend:/app # Hot-reloading
      - /app/node_modules # Prevent overriding container node_modules
    networks:
      - siyaphambili_net

# ---------------------------------------
# Shared Volumes & Networks
# ---------------------------------------
volumes:
  postgres_data:

networks:
  siyaphambili_net:
    driver: bridge